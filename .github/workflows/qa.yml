name: QA

# Sicherheitsnetz für die Bestandsaufnahme aus QA-PLAN.md Phase 4.
# Vier voneinander unabhängige Jobs — laufen parallel, jeder bricht für sich
# ab. So sieht man auf einen Blick, an welcher Schicht es klemmt.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit

  test:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx prettier --check .

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build

  smoke:
    name: Smoke (no console.log in edge functions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verbiete console.log in Edge Functions (außer logger.ts)
        run: |
          MATCHES=$(grep -rn "console\.log" supabase/functions/ \
            --exclude-dir=node_modules \
            | grep -v "_shared/logger.ts" || true)
          if [ -n "$MATCHES" ]; then
            echo "console.log in Edge Functions gefunden — nutze createLogger():"
            echo "$MATCHES"
            exit 1
          fi
          echo "OK — keine console.log-Treffer."
