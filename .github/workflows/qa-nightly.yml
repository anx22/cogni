name: QA Nightly

# Täglicher voller QA-Lauf: Lint, Typecheck, Vitest, Deno-Tests gegen Edge
# Functions, Build, plus test-data-sweep gegen die Cloud. Ergebnisse als
# Workflow-Run sichtbar — bei Rot: NOW.md aktualisieren.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  lint-typecheck-test-build:
    name: Lint + Typecheck + Vitest + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bunx tsc --noEmit
      - run: bun run test
      - run: bunx prettier --check .
      - run: bun run build

  deno-tests:
    name: Deno Edge-Function Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      - run: deno test --allow-net --allow-env supabase/functions/

  sweep:
    name: test-data-sweep
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sweep
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY missing — skipping"
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            "$SUPABASE_URL/functions/v1/test-data-sweep" \
            -d '{}'
