name: QA Nightly

# Täglicher Smoke-Run gegen test-data-sweep, damit die Sweeper-Funktion nicht
# stillschweigend brockelt. Ergebnisse als Workflow-Run sichtbar.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  sweep:
    name: test-data-sweep
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sweep
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY missing — skipping"
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            "$SUPABASE_URL/functions/v1/test-data-sweep" \
            -d '{}'
